name: Build Corne Mainline QMK

on:
  push:
    paths:
      - '.github/workflows/build_corne.yaml'
      - 'vendor/qmk/**'
      - 'keyboards/keebart/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard:
    name: Corne standard / default
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Checkout official Mainline QMK
        uses: actions/checkout@v6
        with:
          repository: qmk/qmk_firmware
          ref: d194c077ed964195ec16d255c7a4b89a794cf03b
          path: qmk_firmware
          submodules: recursive

      - name: Install QMK dependencies
        run: pip install -r qmk_firmware/requirements.txt

      - name: Install hardware definition and configure external userspace
        run: |
          test ! -e qmk_firmware/keyboards/keebart/corne_mx_pro
          mkdir -p qmk_firmware/keyboards/keebart
          cp -R vendor/qmk/keyboards/keebart/corne_mx_pro qmk_firmware/keyboards/keebart/
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE"
          git -C qmk_firmware rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

      - name: Compile manufacturer standard keymap
        run: qmk compile -kb keebart/corne_mx_pro/standard -km default

      - name: Upload standard UF2
        uses: actions/upload-artifact@v7
        with:
          name: corne-standard-default
          path: |
            *.uf2
            qmk_firmware/*.uf2
          if-no-files-found: error
